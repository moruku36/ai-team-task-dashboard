<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Team · タスク</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand"><img src="/favicon.png" width="28" height="28" alt=""><div><small>AI TEAM</small><h1>タスクダッシュボード</h1></div></div><span id="connection" role="status">接続確認中…</span><div id="auth" role="group" aria-label="サインイン"></div></header>
<main><nav aria-label="表示グループ" id="groups"></nav><section class="toolbar"><label>タスクを検索 <input id="search" type="search" placeholder="タイトル・担当・詳細"></label><button id="refresh">更新</button><span id="times"></span></section><p id="notice" role="alert"></p><section id="quota" aria-label="クォータ状況"></section><details id="quotaImport" hidden><summary>残量データを取り込む(オーナー用)</summary><p>ローカルの dashboard-usage.json（または scripts/usage-upload-prepare.mjs の出力）を選んでください。収集時刻はファイルの値が使われ、保存済みより古いファイルは拒否されます。</p><input id="quotaFile" type="file" accept="application/json,.json"> <button id="quotaSend" type="button">取り込む</button><p id="quotaImportNotice" role="status"></p></details><details id="planImport" hidden><summary>チケット差分を適用する(オーナー用・一回限り)</summary><p>scripts/ticket-sync-plan.mjs で作ったプランを選んでください。作成から30分以内のものだけ受け付け、競合した時点で中止します。</p><input id="planFile" type="file" accept="application/json,.json"> <button id="planSend" type="button">適用する</button><p id="planNotice" role="status"></p></details><div id="board"></div><dialog id="detail"><form method="dialog"><button class="close">閉じる</button></form><h2 id="detailTitle"></h2><pre id="detailBody"></pre><label>状態 <select id="status"></select></label><button id="save">状態を保存</button><p id="saveNotice" role="status"></p></dialog></main></body></html>
