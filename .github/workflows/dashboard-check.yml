name: Dashboard checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    name: Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate hosted Linux Chrome
        if: runner.os == 'Linux'
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Synthetic CLI regressions
        run: node scripts/check-dashboard.mjs
      - name: Static build
        run: node cloud/build.mjs
