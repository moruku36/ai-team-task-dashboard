<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">タスクダッシュボード：現在のWindows版と計画中のVercel・Neon版</title>
  <desc id="desc">現在は公式Backlog CLIとMCPが共通no-git Markdownを更新し、file watchとWebSocketで標準UIに反映する。計画では本人がVercel AuthenticationとAll Deploymentsを通り、配信資産だけの静的出力にある新UIとAPIを使う。APIはNeon PostgreSQLを唯一の正本とする。AIのAPI認証は未確定。保護検証と移送承認の後にローカルwriterを停止して一回だけimportする。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3578be"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7660c6"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#278464"/></marker>
  </defs>
  <style>
    text{font-family:"Yu Gothic","Noto Sans JP",system-ui,sans-serif;fill:#172b4d}
    .title{font-size:32px;font-weight:700}.section{font-size:25px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.note{font-size:20px}.muted{fill:#53657f}
    .local{fill:#eaf3ff;stroke:#3578be;stroke-width:2}.cloud{fill:#f1edff;stroke:#7660c6;stroke-width:2}.db{fill:#e4f7ef;stroke:#278464;stroke-width:2}
    .b{fill:none;stroke:#3578be;stroke-width:3;marker-end:url(#blue)}.p{fill:none;stroke:#7660c6;stroke-width:3;marker-end:url(#purple)}.g{fill:none;stroke:#278464;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#green)}
  </style>
  <rect width="1600" height="1080" fill="#f7f9fc"/>
  <text x="50" y="57" class="title">タスクダッシュボードの全体設計</text>
  <text x="50" y="93" class="note muted">PC停止中も本人が閲覧できるクラウドへ。公開GitHubには設計・コード・合成例だけ。</text>

  <rect x="30" y="126" width="1540" height="277" rx="20" fill="#fff" stroke="#d2dfef"/>
  <text x="55" y="167" class="section">現在：Windows ローカル</text>
  <rect x="1390" y="143" width="140" height="37" rx="18" fill="#d9eefc"/>
  <text x="1460" y="169" text-anchor="middle" class="small">稼働済み</text>
  <rect x="55" y="211" width="280" height="108" rx="12" class="local"/>
  <text x="195" y="246" text-anchor="middle" class="label">AI → Windows 委譲</text>
  <text x="195" y="277" text-anchor="middle" class="small">公式 CLI / stdio MCP</text>
  <text x="195" y="303" text-anchor="middle" class="small">Backlog.md v1.53.0</text>
  <path d="M335 265 H393" class="b"/>
  <rect x="400" y="211" width="320" height="108" rx="12" class="db"/>
  <text x="560" y="251" text-anchor="middle" class="label">共通 no-git Markdown</text>
  <text x="560" y="284" text-anchor="middle" class="note">現在の正本 ／ コードrepo外</text>
  <path d="M720 265 H773" class="b"/>
  <rect x="780" y="211" width="300" height="108" rx="12" class="local"/>
  <text x="930" y="251" text-anchor="middle" class="label">file watch</text>
  <text x="930" y="284" text-anchor="middle" class="note">ContentStore → WebSocket</text>
  <path d="M1080 265 H1133" class="b"/>
  <rect x="1140" y="211" width="385" height="108" rx="12" class="local"/>
  <text x="1332" y="251" text-anchor="middle" class="label">標準 Backlog.md UI</text>
  <text x="1332" y="284" text-anchor="middle" class="note">本人が loopback で閲覧</text>
  <text x="55" y="369" class="note muted">PC／serverの起動が必要。</text>
  <text x="780" y="369" class="note muted">切断後の継続更新にはページ再読込が必要。</text>

  <path d="M560 319 V420 H1260 V733" class="g"/>
  <rect x="650" y="405" width="590" height="38" rx="12" fill="#f7f9fc"/>
  <text x="945" y="431" text-anchor="middle" class="small" fill="#278464">保護検証 → 移送承認 → writer停止 → 一回のimport</text>

  <rect x="30" y="455" width="1540" height="509" rx="20" fill="#fff" stroke="#ddd5ed"/>
  <text x="55" y="498" class="section">計画：Vercel + Neon（Backlog.md自体のホストではない）</text>
  <rect x="1390" y="474" width="140" height="37" rx="18" fill="#eee7fc"/>
  <text x="1460" y="500" text-anchor="middle" class="small">計画・準備</text>
  <path d="M1260 455 V733" class="g"/>

  <rect x="55" y="548" width="250" height="104" rx="12" class="cloud"/>
  <text x="180" y="589" text-anchor="middle" class="label">本人のブラウザー</text>
  <text x="180" y="621" text-anchor="middle" class="note">PC停止中も閲覧する計画</text>
  <path d="M305 600 H353" class="p"/>
  <rect x="360" y="538" width="340" height="133" rx="12" class="cloud"/>
  <text x="530" y="576" text-anchor="middle" class="label">Vercel Authentication</text>
  <text x="530" y="609" text-anchor="middle" class="note">All Deployments ／ 本人限定</text>
  <text x="530" y="641" text-anchor="middle" class="small">全URL・資産・APIの拒否を要検証</text>
  <path d="M700 600 H753" class="p"/>

  <rect x="760" y="538" width="340" height="133" rx="12" class="cloud"/>
  <text x="930" y="576" text-anchor="middle" class="label">静的配信 → 新Kanban UI</text>
  <text x="930" y="609" text-anchor="middle" class="note">filesystem 優先経路も保護</text>
  <text x="930" y="641" text-anchor="middle" class="small">出力先は配信資産だけに明示</text>
  <path d="M530 671 V746 H753" class="p"/>
  <text x="588" y="731" class="small">APIの入口も保護</text>
  <path d="M930 671 V692" class="p"/>
  <text x="947" y="692" class="small">同一originで取得・更新</text>
  <rect x="760" y="701" width="340" height="133" rx="12" class="cloud"/>
  <text x="930" y="739" text-anchor="middle" class="label">Vercel Node API</text>
  <text x="930" y="772" text-anchor="middle" class="note">版番号 ／ transaction ／ 要求ID</text>
  <text x="930" y="804" text-anchor="middle" class="small">画面は30秒ごと・保存後に再取得</text>
  <path d="M1100 758 H1153" class="p"/>
  <path d="M1160 792 H1107" class="p"/>
  <rect x="1160" y="741" width="365" height="128" rx="12" class="db"/>
  <text x="1342" y="782" text-anchor="middle" class="label">Neon PostgreSQL</text>
  <text x="1342" y="816" text-anchor="middle" class="note">移行後の唯一の正本</text>
  <text x="1342" y="846" text-anchor="middle" class="small">実DB・TLS・別接続競合は未検証</text>

  <rect x="55" y="755" width="430" height="100" rx="12" class="cloud"/>
  <text x="270" y="793" text-anchor="middle" class="label">AI → Windows 委譲CLI</text>
  <text x="270" y="826" text-anchor="middle" class="note">API認証の経路は未確定</text>
  <path d="M485 794 H530 V678" class="p" stroke-dasharray="8 7"/>
  <text x="55" y="923" class="note muted">静的出力にソース・文書・秘密を入れない。旧CLI／MCPとの自動同期はしない。</text>

  <text x="50" y="1008" class="note">移行前の条件：設計レビュー → 合成データで構築・保護検証 → 実データ移送の別承認</text>
  <text x="50" y="1047" class="small muted">青：現在の経路　紫：クラウドの設計　緑の点線：承認後の一回の移行　紫の点線：未確定の認証接続</text>
</svg>
